<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            text-align: center;
        }
        h1 {
            color: #333;
            font-size: 2em;
            margin-bottom: 15px;
        }
        .btn-adicionar {
            background: #4CAF50;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-adicionar:hover {
            background: #45a049;
        }
        .lista-produtos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .produto-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }
        .produto-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .produto-nome {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .produto-categoria {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        .produto-preco {
            font-size: 1.2em;
            color: #4CAF50;
            font-weight: bold;
            margin: 10px 0;
        }
        .produto-acoes {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .btn-editar {
            background: #2196F3;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .btn-editar:hover {
            background: #0b7dda;
        }
        .btn-eliminar {
            background: #f44336;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-eliminar:hover {
            background: #da190b;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s;
        }
        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
            animation: slideDown 0.3s;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-header h2 {
            color: #333;
            margin: 0;
        }
        .btn-fechar {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
            line-height: 1;
            padding: 0;
            width: 30px;
            height: 30px;
        }
        .btn-fechar:hover {
            color: #333;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideDown {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .form-container {
            display: none;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            margin: 0 auto;
        }
        .form-container.active {
            display: block;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn-salvar {
            background: #4CAF50;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }
        .btn-salvar:hover {
            background: #45a049;
        }
        .mensagem-vazio {
            text-align: center;
            color: white;
            font-size: 1.2em;
            padding: 40px;
        }
    </style>
    <title>Sistema de Produtos</title>
</head>
<body>
    <div class="container">
        <header>
            <h1>Sistema de Gestão de Produtos</h1>
            <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
                <button class="btn-adicionar" id="btnToggle" onclick="toggleForm()">Adicionar Produto</button>
                <a href="/categorias" class="btn-adicionar" style="text-decoration: none; display: inline-block; line-height: 1;">Gerenciar Categorias</a>
            </div>
        </header>
        
        <div class="form-container" id="formContainer">
            <h2 style="margin-bottom: 20px; color: #333;">Novo Produto</h2>
            <form action="/salvar-produto" method="post">
                <div class="form-group">
                    <label for="nome">Nome do Produto:</label>
                    <input type="text" id="nome" name="nome" required>
                </div>
                <div class="form-group">
                    <label for="categoria">Categoria:</label>
                    <select id="categoria" name="categoria" required>
                        {{CATEGORIAS}}
                    </select>
                </div>
                <div class="form-group">
                    <label for="preco">Preço (Kz):</label>
                    <input type="number" id="preco" name="preco" step="0.01" required>
                </div>
                <button type="submit" class="btn-salvar">Salvar Produto</button>
            </form>
        </div>
        
        <div class="lista-produtos" id="listaProdutos">
            {{PRODUTOS}}
        </div>
    </div>
    
    <!-- Modal de Edição -->
    <div class="modal" id="modalEditar">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Editar Produto</h2>
                <button class="btn-fechar" onclick="fecharModal()">&times;</button>
            </div>
            <form id="formEditar" method="post">
                <input type="hidden" id="edit-id" name="id">
                <div class="form-group">
                    <label for="edit-nome">Nome do Produto:</label>
                    <input type="text" id="edit-nome" name="nome" required>
                </div>
                <div class="form-group">
                    <label for="edit-categoria">Categoria:</label>
                    <select id="edit-categoria" name="categoria" required>
                        {{CATEGORIAS}}
                    </select>
                </div>
                <div class="form-group">
                    <label for="edit-preco">Preço (Kz):</label>
                    <input type="number" id="edit-preco" name="preco" step="0.01" required>
                </div>
                <button type="submit" class="btn-salvar">Atualizar Produto</button>
            </form>
        </div>
    </div>
    
    <script>
        function toggleForm() {
            const form = document.getElementById('formContainer');
            const lista = document.getElementById('listaProdutos');
            const btn = document.getElementById('btnToggle');
            
            if (form.classList.contains('active')) {
                form.classList.remove('active');
                lista.style.display = 'grid';
                btn.textContent = 'Adicionar Produto';
            } else {
                form.classList.add('active');
                lista.style.display = 'none';
                btn.textContent = 'Ver Produtos';
            }
        }
        
        function abrirModalEditar(id, nome, categoriaId, preco) {
            document.getElementById('edit-id').value = id;
            document.getElementById('edit-nome').value = nome;
            document.getElementById('edit-categoria').value = categoriaId;
            document.getElementById('edit-preco').value = preco;
            document.getElementById('modalEditar').classList.add('active');
        }
        
        function fecharModal() {
            document.getElementById('modalEditar').classList.remove('active');
        }
        
        // Fechar modal ao clicar fora dele
        document.getElementById('modalEditar').addEventListener('click', function(e) {
            if (e.target === this) {
                fecharModal();
            }
        });
        
        // Submeter formulário de edição
        document.getElementById('formEditar').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            this.action = '/editar-produto/' + id;
            this.submit();
        });
    </script>
</body>
</html>
